#create system user for catalogue
- name: create system user for catalogue
  ansible.builtin.user:
    name: roboshop
    system: true
    home: /app
    shell: /sbin/nologin
    comment: "RoboShop Catalogue User"

#remove app directory if exists
- name: remove app directory
  ansible.builtin.file:
    path: /app
    state: absent
    
#create app directory
- name: create app directory
  ansible.builtin.file:
    path: /app
    state: directory

#remove app directory if exists
- name: remove old catalogue code
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent
    
#download catalogue code
- name: download catalogue code
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component}}.zip

#unarchive catalogue code
- name: Unarchive a file that is already on the remote machine
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes